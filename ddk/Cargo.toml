[package]
name = "ddk"
description = "application tooling for DLCs 🌊"
documentation = "https://docs.rs/crate/ddk"
homepage = "https://dlcdevkit.com"
readme = "../README.md"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[features]
default = ["manager"]

# The full DLC manager application: builder, chain sync, wallet, storage,
# oracle, and transport services. This pulls the async/networked stack
# (tokio, zeromq, bdk_esplora, ...). Turn it OFF (`default-features = false`)
# for FFI/mobile consumers that only need the stateless `contract` module and
# `ContractKeyProvider`, which depend on nothing heavier than `ddk-manager`.
manager = [
    "ddk-manager/manager",
    "dep:kormir",
    "dep:bdk_esplora",
    "dep:tokio",
    "dep:zeromq",
    "dep:uuid",
    "dep:chrono",
    "dep:serde_json",
    "dep:async-trait",
    "dep:hmac",
    "dep:sha2",
]

# transport features
nostr = ["manager", "dep:nostr-rs", "dep:nostr-sdk", "dep:base64"]
lightning = ["manager", "dep:lightning-net-tokio"]

# oracle features
kormir = ["manager", "dep:reqwest"]
p2pderivatives = ["manager", "dep:reqwest"]
nostr-oracle = ["dep:nostr-database", "nostr", "kormir", "kormir/nostr"]

# storage features
sled = ["manager", "dep:sled"]
postgres = ["manager", "dep:sqlx", "sqlx/postgres"]

[dependencies]
ddk-manager = { workspace = true, features = ["std", "use-serde"] }
ddk-dlc = { workspace = true, features = ["std", "use-serde"] }
ddk-messages = { workspace = true, features = ["std", "use-serde"] }
ddk-trie = { workspace = true, features = ["std", "use-serde"] }
kormir = { workspace = true, optional = true }

bitcoin = { workspace = true, features = ["std", "rand", "serde"] }
bdk_esplora = { version = "0.22.2", default-features = false, features = ["std", "async-https", "tokio"], optional = true }
bdk_wallet = "3.0.0"
bdk_chain = "0.23.3"
lightning = { workspace = true, features = ["std", "grind_signatures"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"], optional = true }
tracing = { workspace = true }
uuid = { version = "1.8.0", features = ["v4"], optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
async-trait = { workspace = true, optional = true }
hex = { workspace = true }

# storage features
sled = { version = "0.34.7", optional = true }
sqlx = { version = "0.8.3", optional = true, default-features = false, features = ["runtime-tokio", "macros", "migrate", "time", "bigdecimal", "chrono"] }

# Nostr transport dependencies
base64 = { version = "0.22.1", optional = true }
nostr-rs = { package = "nostr", version = "0.44.0", features = ["std", "nip04"], optional = true }
nostr-sdk = { version = "0.44.0", optional = true }

# lightning transport
lightning-net-tokio = { version = "0.2.0", optional = true }

# oracle feature
reqwest = { version = "0.13.3", features = ["json"], optional = true }
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
nostr-database = { version = "0.44.0", optional = true }
bip39 = "2.2.0"
zeroize = "1"

# zmq feature
zeromq = { version = "0.6.0", optional = true }

[dev-dependencies]
test-log = { version = "0.2.16", features = ["trace"] }
ddk-payouts = { workspace = true }
bitcoincore-rpc = { workspace = true }
dotenvy = { workspace = true }
# The `nostr`/`postgres` backends are enabled unconditionally rather than from
# ddk's own features of the same name: a feature can't forward to a path-only
# dev-dependency, because cargo strips that dependency when packaging.
ddk-testenv = { workspace = true, features = ["dlc", "nostr", "postgres"] }

[[example]]
name = "lightning"
path = "examples/lightning.rs"
required-features = ["lightning", "kormir", "sled"]

[[example]]
name = "nostr"
path = "examples/nostr.rs"
required-features = ["nostr"]

[[example]]
name = "postgres"
path = "examples/postgres.rs"
required-features = ["postgres", "lightning", "kormir"]
