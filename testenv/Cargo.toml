[package]
name = "ddk-testenv"
description = "Managed regtest backends for the dlcdevkit test suites."
version.workspace = true
# Above the workspace's minimum supported version: postgresql_embedded 0.22
# needs 1.94. This crate is never published and only builds for tests, so the
# `msrv` CI job leaves it out.
rust-version = "1.94"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Test-only helper crate. Never goes to crates.io; `ddk` and `ddk-manager`
# depend on it through a path-only dev-dependency, which cargo strips when
# packaging them.
publish = false

[features]
default = []
# In-process nostr relay, for the `nostr` transport tests.
nostr = ["dep:nostr-relay-builder"]
# Embedded PostgreSQL server, for the `postgres` storage tests.
postgres = ["dep:postgresql_embedded"]
# Oracles, events and contract shapes, shared by the `ddk` and `ddk-manager`
# test suites. This depends on `ddk`, which depends on `ddk-manager`, both of
# which depend on this crate in turn — a cycle cargo allows because theirs are
# dev-dependencies.
dlc = ["dep:ddk", "dep:ddk-dlc", "dep:ddk-manager", "dep:ddk-messages", "dep:ddk-trie"]

[dependencies]
bitcoin = { workspace = true, features = ["std"] }
bitcoincore-rpc = { workspace = true }
bitcoind = { workspace = true }
electrsd = { workspace = true }
libc = "0.2"

ddk = { workspace = true, features = ["manager"], optional = true }
ddk-dlc = { workspace = true, optional = true }
ddk-manager = { workspace = true, features = ["manager"], optional = true }
ddk-messages = { workspace = true, optional = true }
ddk-trie = { workspace = true, optional = true }

nostr-relay-builder = { version = "0.44.1", optional = true }
# 0.22 extracts the tar hardlinks that PostgreSQL archives from 18.6.1 on use
# for their timezone data; earlier versions skip them.
# rustls instead of the default native-tls, so nothing in the workspace links OpenSSL.
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["tls-rustls-ring", "theseus"], optional = true }
