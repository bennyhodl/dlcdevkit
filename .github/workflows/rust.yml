on:
  push:
    branches:
      - master
  pull_request:

# Cancel superseded runs on the same PR branch (master runs always finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The test suites manage their own bitcoind, electrs, postgres and nostr relay
# (see the `ddk-testenv` crate), so no service containers or connection
# environment variables are needed here.
env:
  CARGO_TERM_COLOR: always
  NB_CONFIRMATIONS: 6

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component clippy
          rustup default 1.89.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Check clippy
        run: cargo clippy -- -D warnings
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default nightly
      - name: Check format
        run: cargo fmt --check
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo check
        run: cargo check --all-features
  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Cache embedded postgres binaries
        uses: actions/cache@v4
        with:
          path: ~/.theseus/postgresql
          key: theseus-postgresql-${{ runner.os }}
      - name: Run unit tests
        run: cargo test --all-features
  integration_tests_prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      # rust-cache is declared first so that its post-step (which prunes target/)
      # runs AFTER the run_id cache below saves the freshly compiled test binaries.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # `target/debug/build` carries the bitcoind and electrs executables that
      # the build scripts downloaded. The test binaries resolve them through the
      # OUT_DIR path baked in at compile time, so both directories have to be
      # restored together for the matrix jobs to find them.
      - name: Cache compiled test binaries for the matrix jobs
        uses: actions/cache@v4
        with:
          path: |
            target/debug/deps
            target/debug/build
          key: test-cache-${{ github.run_id }}-${{ github.run_number }}
      # Not --all-features: that turns on ddk-manager's `fuzztarget`, which
      # replaces the contract id and serial id generators with constants. A test
      # that creates a second contract, as every splice does, then collides with
      # the first. The features named here are the ones the integration tests
      # actually want.
      - id: set-matrix
        run: cargo test --no-run --features ddk-manager/parallel,ddk-manager/use-serde && echo "matrix=$(testconfig/scripts/get_test_list.sh manager_execution manager_tests contract_updater stateless_execution)" >> "$GITHUB_OUTPUT"
  integration_tests:
    name: integration tests
    needs: integration_tests_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        tests: ${{ fromJson(needs.integration_tests_prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            target/debug/deps
            target/debug/build
          key: test-cache-${{ github.run_id }}-${{ github.run_number }}
      # --exact, because a matrix entry names one test. Without it the name is
      # a substring filter, and a job for `enum_single_oracle_test` would also
      # run `splice_in_enum_single_oracle_test`.
      - name: Run test
        run: RUST_BACKTRACE=1 ${{ matrix.tests }} --ignored --exact
